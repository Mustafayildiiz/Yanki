[build-system]
# Derleme arka ucu sürümü sabitlenir (NFR-15).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "yanki"
version = "0.1.0"
description = "Yapay zeka destekli web erişilebilirlik denetim ve puanlama aracı (WCAG 2.2)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mustafa Yıldız" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Doğrudan bağımlılıklar. Kesin sürümler requirements.lock içindedir (NFR-15).
# playwright, Docker taban imajının etiketiyle AYNI olmalıdır (1.65.2).
dependencies = [
    "playwright==1.65.2",
    "pydantic>=2.14,<3",
    "typer>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]
# Alt metin modelleri (Faz 2: BLIP, MarianMT, E5, CLIP). Ayrı kilitlenir
# (requirements-ml.lock, yalnızca Linux/Docker); torch CPU indeksinden gelir.
# Bu ekstra kurulu değilse alt metin modülünün yalnızca kural tabanlı adımları çalışır.
ml = [
    "torch>=2.15,<2.16",
    "transformers>=5.23,<6",
    "sentencepiece>=0.2.3,<0.3",
    "safetensors>=0.8,<0.9",
    "pillow>=13,<14",
    "numpy>=2.4,<3",
]

[project.scripts]
yanki = "yanki.cli:app"

# torch yalnızca CPU indeksinden kurulur (NFR-12: GPU varsayılmaz; CUDA paketleri çekilmez).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["yanki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gerçek model ağırlığı gerektiren testler varsayılan olarak seçilmez;
# `pytest -m models` ile çalıştırılır (komut satırındaki -m bunu geçersiz kılar).
addopts = "-ra --strict-markers -m 'not models'"
markers = [
    "browser: Chromium başlatan entegrasyon testleri (Playwright gerekir)",
    "models: gerçek model ağırlıkları gerektiren testler (ml ekstrası + `yanki models download`)",
]

[tool.coverage.run]
source = ["yanki"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "RUF001",  # Türkçe metinde belirsiz Unicode karakter uyarısı
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["yanki"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S310"]
"scripts/**" = ["S"]
