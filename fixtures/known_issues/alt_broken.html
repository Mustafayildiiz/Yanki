<!doctype html>
<!-- Set B (ALT-10): indirilemeyen ya da çözülemeyen görseller. Bulgu üretmez;
     raporda "analiz edilemedi" (status=failed) olarak görünür. Alt metinleri
     anlamlıdır, böylece kural tabanlı denetimler de bulgu üretmez.
     #b-corrupt: görsel olmayan dosya; #b-missing: olmayan dosya;

  </style>
</head>
<body>
  <header><a href="#anasayfa">Ana sayfa</a></header>
  <main>

    <img id="b-blocked" src="http://127.0.0.1:9/blocked.jpg" alt="Kent müzesinin giriş kapısı">

  <footer><a href="#iletisim">İletişim</a></footer>

</html>
