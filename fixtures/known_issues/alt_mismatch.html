<!doctype html>
<!-- Set B (ALT-06, uyumsuz): alt metin görselle anlamca ilgisiz. Kural tabanlı
     araçlar (axe image-alt) bunları kaçırır: alt metin var ve boş değil.
     #x-dog: köpek → "kırmızı spor araba"; #x-car: kırmızı araba → göl;
     #x-horses: atlar → çorba; #x-lighthouse: deniz feneri → kedi;
     #x-sailboat: yelkenli → apartman. Klavye bulgusu beklenmez. -->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Haftanın fotoğrafları</title>
  <style>
    body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
    header, main, footer { padding: 1rem 2rem; }
    img { max-width: 300px; height: auto; display: block; margin: .5rem 0; }
  </style>
</head>
<body>
  <header><a href="#anasayfa">Ana sayfa</a></header>
  <main>
    <h1>Okurlarımızdan gelen fotoğraflar</h1>
    <h2>Park</h2>
    <img id="x-dog" src="../images/dog_ball.jpg" alt="Kırmızı bir spor araba">
    <h2>Eski şehir</h2>
    <img id="x-car" src="../images/red_car.jpg" alt="Karlı dağların önündeki turkuaz bir göl">
    <h2>Bozkır</h2>
    <img id="x-horses" src="../images/horses.jpg" alt="Bir kase sıcak mercimek çorbası">
    <h2>Sahil</h2>
    <img id="x-lighthouse" src="../images/lighthouse.jpg" alt="Kanepede uyuyan tekir bir kedi">
    <h2>Göl</h2>
    <img id="x-sailboat" src="../images/sailboat.jpg" alt="Kırmızı tuğlalı çok katlı bir apartman">
  </main>
  <footer><a href="#iletisim">İletişim</a></footer>
</body>
</html>
