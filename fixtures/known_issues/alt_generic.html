<!doctype html>
<!-- Set B (ALT-07): dosya adı ya da genel ifade olan alt metinler.
     #g-file "image1.png", #g-resim "resim", #g-foto "Foto", #g-dsc "DSC_0012",
     #g-gorsel "görsel", #g-srcname alt metni src dosya adının kendisi ("lighthouse").
     Klavye bulgusu beklenmez. -->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Gezi fotoğrafları</title>
  <style>
    body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
    header, main, footer { padding: 1rem 2rem; }
    img { max-width: 280px; height: auto; }
  </style>
</head>
<body>
  <header><a href="#anasayfa">Ana sayfa</a></header>
  <main>
    <h1>Yaz gezimizden kareler</h1>
    <p>Gezi boyunca çektiğimiz fotoğraflardan bir seçki.</p>
    <img id="g-file" src="../images/cat_burmese.jpg" alt="image1.png">
    <img id="g-resim" src="../images/boathouse_lake.jpg" alt="resim">
    <img id="g-foto" src="../images/sunflowers.jpg" alt="Foto">
    <img id="g-dsc" src="../images/train_station.jpg" alt="DSC_0012">
    <img id="g-gorsel" src="../images/market_vegetables.jpg" alt="görsel">
    <img id="g-srcname" src="../images/lighthouse.jpg" alt="lighthouse">
  </main>
  <footer><a href="#iletisim">İletişim</a></footer>
</body>
</html>
