[build-system]
# Derleme arka ucu sürümü sabitlenir (NFR-15).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "yanki"
version = "0.1.0"
description = "Yapay zeka destekli web erişilebilirlik denetim ve puanlama aracı (WCAG 2.2)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mustafa Yıldız" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Doğrudan bağımlılıklar. Kesin sürümler requirements.lock içindedir (NFR-15).
# playwright, Docker taban imajının etiketiyle AYNI olmalıdır (1.65.2).
dependencies = [
    "playwright==1.65.2",
    "pydantic>=2.14,<3",
    "typer>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[project.scripts]
yanki = "yanki.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["yanki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "browser: Chromium başlatan entegrasyon testleri (Playwright gerekir)",
]

[tool.coverage.run]
source = ["yanki"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "RUF001",  # Türkçe metinde belirsiz Unicode karakter uyarısı
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["yanki"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S310"]
"scripts/**" = ["S"]
